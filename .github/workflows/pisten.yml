# Baut jede Woche die Pistendatei der Alpen aus OpenSkiData neu und veröffentlicht sie als GitHub-Release.
# Die App lädt sie von: https://github.com/<benutzer>/skiradar/releases/latest/download/alpen-pisten.json.gz
# OpenSkiData erlaubt automatische Downloads höchstens 1× pro Tag – hier 1× pro Woche.
name: Pistendaten aktualisieren
on:
  schedule:
    - cron: '17 3 * * 1'     # montags 03:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Stand bei OpenSkiData prüfen
        id: stand
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          neu=$(curl -sSLf https://tiles.openskimap.org/metadata.json | python3 -c "import json,sys;print(json.load(sys.stdin)['source']['openStreetMap']['dataTimestamp'][:10])")
          alt=$(gh release view --json tagName -q .tagName 2>/dev/null | sed 's/^pisten-//' || true)
          echo "neu=$neu alt=$alt"
          echo "neu=$neu" >> "$GITHUB_OUTPUT"
          if [ "$neu" != "$alt" ]; then echo "bauen=ja" >> "$GITHUB_OUTPUT"; fi
      - name: Pistendatei bauen
        if: steps.stand.outputs.bauen == 'ja'
        run: |
          python3 -c "import sys; sys.path.insert(0,'tools'); import pisten_bauen as p; p.CHECK_DAYS=0; p.main('cache','daten')"
          ls -la daten
          python3 -c "import gzip,json;d=json.loads(gzip.open('daten/alpen-pisten.json.gz').read());n=len(d['blocks']);print('Bereiche',n,'Stand',d['date']);assert n>1000"
      - name: Als Release veröffentlichen
        if: steps.stand.outputs.bauen == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pisten-${{ steps.stand.outputs.neu }}"
          gh release create "$tag" daten/alpen-pisten.json.gz --latest --title "Pistendaten Alpen, Stand ${{ steps.stand.outputs.neu }}" \
            --notes "Pisten und Lifte der Alpen für SkiRadar. Quelle: OpenSkiData / OpenSkiMap.org, © OpenStreetMap-Mitwirkende, Skimap.org. Lizenz: Open Database License (ODbL) 1.0 – https://opendatacommons.org/licenses/odbl/1-0/"
          # alte Releases aufräumen (die letzten 4 bleiben)
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^pisten-' | sort -r | tail -n +5 | xargs -r -I{} gh release delete {} --yes --cleanup-tag
